name: Release

# Triggered when a GitHub Release is PUBLISHED — deliberately not on tag push.
#
# A tag-triggered workflow would publish a Homebrew cask for every merge. The
# Release step was designed as that human gate: walk the scenario, then publish.
#
# ⚠️ That gate is not currently enforced: `github-releaser-agent` creates the
# GitHub Release itself, within seconds of the tag, so this workflow runs for
# every merge anyway. Measured 2026-11-11 on v0.10.0 and v0.10.1 (author
# ben-s-github-releaser[bot]); between v0.6.0 and v0.9.7 the same agent created
# no Releases at all, which is where the 18-version tap drift came from.
#
# Treat the scenario gate as operator-side and verify it with
# `make release-status`, not with this trigger. See docs/releasing-distill.md.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # goreleaser needs full history + tags to resolve {{ .Tag }}.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: 'v2.17.0'
          args: release --clean
        env:
          # Attaches archives to the already-published Release on this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the generated Homebrew cask to bborbe/homebrew-tap (cross-repo).
          # SECURITY: fine-grained PAT scoped to ONLY the homebrew-tap repo with
          # Contents: Read and write (nothing else). This limits blast radius if the
          # secret leaks — a compromised token can only touch the tap, not this repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
